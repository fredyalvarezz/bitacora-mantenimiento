<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Bitacora de Mantenimiento</title>
    <!--
      Truco necesario para que React Router funcione en GitHub Pages.
      GitHub Pages no sabe manejar rutas como /equipment/123 (devuelve 404).
      Este script guarda la ruta solicitada y redirige a index.html,
      donde un script en main.jsx la vuelve a reconstruir.
    -->
    <script>
      var pathSegmentsToKeep = 1; // numero de segmentos del "base" (nombre del repo)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
